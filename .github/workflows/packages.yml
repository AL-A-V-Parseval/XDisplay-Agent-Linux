name: Build Linux packages
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdrm-dev libturbojpeg0-dev python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus-daemon xvfb xauth squashfs-tools desktop-file-utils
          rustup update stable --no-self-update
          rustup override set stable
      - name: Build and test
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: make test
      - name: Package and verify
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl -fLsS --retry 4 -o "$tool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  $tool" | sha256sum -c -
          chmod 755 "$tool"
          APPIMAGETOOL="$tool" bash packaging/build.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xdisplay-linux-x86_64
          path: dist/*
          if-no-files-found: error
