[package]
name = "xdisplay-backend"
version = "0.1.0"
edition = "2024"

[features]
frame-diagnostics = ["dep:png", "dep:sha2"]

[dependencies]
png = { version = "0.18", optional = true }
sha2 = { version = "0.10", optional = true }
anyhow = "1"
libc = "0.2"
plist = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "net", "io-util", "time", "signal", "sync"] }

[profile.release]
lto = "thin"
strip = true
